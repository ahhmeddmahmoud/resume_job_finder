name: resume_job_finder
description: "Automated Resume Matching & Job Finder App - DEPI Project"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  # State Management, DI & Routing
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3

  # UI & Fonts
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  crystal_navigation_bar: ^2.0.0

  # Local Profile Photo
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2

  # CV File Picking, PDF Text Extraction, Gemini AI & Real Jobs API
  file_picker: ^8.1.4
  syncfusion_flutter_pdf: ^35.2.13
  google_generative_ai: ^0.4.6
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
